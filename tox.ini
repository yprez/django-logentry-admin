[tox]
envlist =
    {py314,py313,py312}-django61,
    {py314,py313,py312}-django60,
    {py314,py313,py312,py311,py310}-django52,
    flake8

[testenv]
deps =
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
    coverage
    pytest
    pytest-cov
    pytest-django
commands =
    py.test --cov=logentry_admin --cov-report=term-missing --cov-fail-under=90 --cov-append

[testenv:flake8]
deps = flake8
commands = flake8 logentry_admin

name: Release

# Publishing a GitHub release whose tag is v<version> uploads that
# version to PyPI through trusted publishing; no PyPI token is stored.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
      - name: Check the tag matches the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(uv version --short)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match version $version"
            exit 1
          fi
      # The changelog is part of the PyPI description, which an upload
      # cannot change afterwards.
      - name: Check the changelog dates this version
        run: |
          version="$(uv version --short)"
          if ! grep -qE "^v${version//./\\.} - [0-9]{2}/[0-9]{2}/[0-9]{4}$" CHANGELOG.rst; then
            echo "::error::CHANGELOG.rst has no dated v$version heading"
            exit 1
          fi
      - name: Build the sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Only this job can request a PyPI token, and it runs no build code.
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/django-logentry-admin/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-logentry-admin"
version = "1.1.0"
description = "Show all LogEntry objects in the Django admin site."
dynamic = ["readme"]
license = "ISC"
license-files = ["LICENSE.txt"]
authors = [{ name = "Yuri Prezument", email = "y@yprez.com" }]
dependencies = ["Django>=2.2"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 2.2",
    "Framework :: Django :: 3.1",
    "Framework :: Django :: 3.2",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
]

[project.urls]
Homepage = "https://github.com/yprez/django-logentry-admin"
Changelog = "https://github.com/yprez/django-logentry-admin/blob/master/CHANGELOG.rst"
Issues = "https://github.com/yprez/django-logentry-admin/issues"

[tool.setuptools]
packages = ["logentry_admin"]

[tool.setuptools.dynamic]
readme = { file = ["README.rst", "CHANGELOG.rst"], content-type = "text/x-rst" }

[tool.setuptools.package-data]
logentry_admin = [
    "templates/admin/admin/logentry/*.html",
    "locale/*/LC_MESSAGES/*.po",
    "locale/*/LC_MESSAGES/*.mo",
]
